<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Coaching e sviluppo nel calcio giovanile." />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="__APP_NAME__" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>__APP_NAME__</title>
    <script>
      (() => {
        const themes = ['pitch', 'electric', 'purple', 'ice', 'light']
        const colors = { pitch: '#11131a', electric: '#090e18', purple: '#0e0b14', ice: '#071114', light: '#f6f7fb' }
        let theme = 'light'
        try {
          const stored = localStorage.getItem('coach-field-theme')
          theme = themes.includes(stored) ? stored : 'light'
        } catch {
          theme = 'light'
        }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', colors[theme])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
